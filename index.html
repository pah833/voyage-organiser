<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage Organiser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grand-pah"> 
        <div class="tite"> 
            <h1>Mon organisateur de Vayage</h1> 
            <p>Prepare ton prochain depart en oubliant rien!</p> 
        </div>
    <div class="parent">

    <div class="enfant">
        <h2>A Visiter <hr></h2>
        <button id="btnLieux">Ajouter un lieu</button>
        <div class="listeLieux"></div>
    </div>

    <div class="enfant">
        <h2>A Goûter <hr></h2>
        <button id="btngouter">Ajouter un plat</button>
        <div class="listeagouters"></div>
    </div>

    <div class="enfant">
        <h2>A Prendre <hr></h2>
        <button id="btnobjet">Ajouter un objet</button>
        <div class="listeobjets"></div>
    </div>

</div>
<div id="modal">
    <div class="modal-content">
        <h2>Ajouter un élément</h2>

        <input type="text" id="designation" placeholder="Saisir une désignation">

        <button id="btnAjouter">Ajouter</button>
        <button id="btnFermer">Fermer</button>
    </div>
</div>
</div>
</div>
</div>
    <script src="script.js"></script>
</body>
</html>
